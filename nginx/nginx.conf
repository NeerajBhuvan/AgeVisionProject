# AgeVision — nginx reverse proxy (laptop-as-server, production-style).
# Serves the Angular production build and proxies the API + media + Django
# static to the waitress backend on 127.0.0.1:8000.
#
# Deploy: copy this file to  C:\Users\neera\nginx\conf\nginx.conf
# then:   C:\Users\neera\nginx\nginx.exe -t   (test)
#         C:\Users\neera\nginx\nginx.exe       (start)

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Hostnames are longer than the default 32-byte hash bucket.
    map_hash_bucket_size 128;

    # The public Cloudflare host is always served over HTTPS, but cloudflared
    # reaches nginx over http://localhost, so we can't rely on the upstream
    # scheme. Key off the Host: force https for the public hostname, keep
    # $scheme for direct localhost access. This makes Django build https://
    # media URLs on the public site (no mixed-content blocking).
    map $host $fwd_proto {
        default                   $scheme;
        agevision.thinkblooms.in  https;
    }

    # Uploaded photos can be up to 10 MB (Django limit) — allow headroom.
    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  agevision.thinkblooms.in localhost;

        # Angular production build (static SPA).
        root   "D:/AU/Project/AgeVisionProject/agevision-frontend/dist/agevision-frontend/browser";
        index  index.html;

        # Long-cache the hashed JS/CSS chunks; never cache index.html.
        location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Never cache index.html so a new build is picked up on a normal reload
        # (the hashed JS/CSS it references are still long-cached above).
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
        }

        # SPA routing — fall back to index.html for client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # REST API → Django (waitress). No trailing slash on proxy_pass so the
        # /api/ prefix is preserved (Django expects /api/...).
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_http_version 1.1;
            # SSE for /api/progress/stream/ + slow Modal FADING cold starts.
            proxy_buffering   off;
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
        }

        # User-uploaded + generated images (served by Django).
        # ^~ stops the static-asset regex above from hijacking /media/*.jpg.
        location ^~ /media/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }

        # Django admin / DRF static assets (served by whitenoise).
        location ^~ /static/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }
    }
}
