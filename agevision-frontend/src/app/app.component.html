<!-- Animated Background -->
<div id="bg">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="orb o4"></div>
</div>
<div class="noise"></div>

<!-- Auth pages (login/register) — no shell -->
<ng-container *ngIf="isAuthPage">
  <div class="auth-anim-wrap" [@routeAnimation]="getRouteAnimationData()">
    <router-outlet />
  </div>
</ng-container>

<!-- Main App Shell -->
<ng-container *ngIf="!isAuthPage">
  <div id="app">
    <!-- Overlay must live INSIDE #app so it shares its stacking context (isolation: isolate).
         Otherwise the overlay's backdrop-filter blurs the entire #app — including the sidebar. -->
    <div id="sidebar-overlay"
         [class.show]="sidebarOpen"
         (click)="closeSidebar()"></div>
    <app-sidebar [isOpen]="sidebarOpen" (closeSidebar)="closeSidebar()"></app-sidebar>
    <div id="main">
      <app-topbar [sidebarOpen]="sidebarOpen" (hamburgerClick)="toggleSidebar()"></app-topbar>
      <div id="main-content" [@routeAnimation]="getRouteAnimationData()">
        <router-outlet />
      </div>
    </div>
  </div>

</ng-container>
